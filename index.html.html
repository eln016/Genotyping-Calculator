<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCR &amp; Gel Calculator</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1c1c1a;--mut:#6b6b66;--bd:#dcdcd6;--ac:#0f7b6c;--acbg:#e3f3f0;--hl:#fff6d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161615;--card:#1f1f1d;--tx:#ecece8;--mut:#9a9a93;--bd:#34342f;--ac:#4fc3b0;--acbg:#173430;--hl:#3a3418;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#1f1f1d;--tx:#ecece8;--mut:#9a9a93;--bd:#34342f;--ac:#4fc3b0;--acbg:#173430;--hl:#3a3418;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
select,input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
input[type=number]{width:90px}
select{min-width:150px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.glob{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin:10px 0 4px;font-size:15px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}
th{font-size:12px;color:var(--mut);font-weight:600}
td.n{font-variant-numeric:tabular-nums;text-align:right}th.n{text-align:right}
tr.tot td{font-weight:700;border-bottom:0}
.hl{background:var(--hl);font-weight:700}
.pill{display:inline-block;background:var(--acbg);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:13px;margin:2px 6px 2px 0}
.note{color:var(--mut);font-size:13px;margin-top:6px}
h2{font-size:16px;margin:12px 0 2px}
.x{margin-left:auto}
</style>
</head>
<body>
<main>
<h1>PCR &amp; gel calculator</h1>
<p class="sub">Pick a gene, enter your number of mice. Mix volumes are scaled by (samples + extra).</p>

<div class="glob">
  <label>Extra reactions<input type="number" id="extra" min="0" value="1"></label>
  <label>Gel size
    <span class="seg"><button id="gS" class="on">Small</button><button id="gL">Large</button></span>
  </label>
</div>

<div id="rows"></div>
<button class="p" id="add">+ Add another gene</button>
<p class="note">Band notes are copied as written from the lab protocol. Always double-check against the original.</p>
</main>

<script>
const STD={total:15,mm:7.5,idte:3.3,f:0.6,r:0.6,dna:3};
const B3="Top band = Hz/KO (+/\u2212) \u00b7 Double band = Het (+/+) \u00b7 Bottom band = WT (\u2212/+)";
const yn=(n)=>"One band = "+n+" + \u00b7 No band = "+n+" \u2212";
const G={
"Camkk2":{total:25,mm:12.5,idte:8,f:1.25,r:1.25,dna:2,gel:3,load:6,time:50,bands:B3},
"Ah1":{...STD,gel:2,load:4,time:35,bands:B3},
"Math1":{...STD,gel:2,load:4,time:35,bands:yn("Math1")},
"Gfi (primer set: Gfi - GFP)":{...STD,gel:2,load:4,time:35,bands:yn("Gfi")},
"Pax2":{...STD,gel:2,load:4,time:35,bands:yn("Pax2")},
"y2 (y2fl 2025)":{...STD,gel:3,load:8,time:50,bands:B3},
"LKB1":{...STD,gel:2,load:4,time:35,bands:"Top band = KO (+/\u2212) \u00b7 Double band = Het (+/+) \u00b7 Bottom band = WT (\u2212/+). Primers are in Ario\u2019s box."},
"AMPK1":{...STD,gel:2,load:4,time:50,bands:B3},
"AMPK2":{...STD,gel:2,load:4,time:50,bands:B3},
"Tg+ (Tg4)":{...STD,gel:2,load:4,time:50,bands:yn("Tg4")},
"Fhod3":{...STD,gel:2,load:4,time:50,bands:B3},
"Prkag-HA":{...STD,gel:2,load:4,time:50,bands:B3},
"Pgam5 \u2212/\u2212":{...STD,gel:2,load:4,time:35,bands:"No band = Pgam5 \u2212/\u2212 \u00b7 One band = WT"},
"Pgam5 +/+":{...STD,gel:2,load:4,time:35,bands:"One band = Pgam5 +/+"}
};
// gel recipes: [TAE mL, agarose g, stain \u00b5L]
const GEL={1:{S:[25,0.25,0.5],L:[75,0.75,1.5]},2:{S:[25,0.5,0.5],L:[75,1.5,1.5]},3:{S:[25,0.75,0.5],L:[75,2.25,1.5]}};

let size="S";
const names=Object.keys(G);
const fmt=(x)=>String(Math.round(x*100)/100);
const rowsEl=document.getElementById("rows");

function addRow(gene,n){
  const d=document.createElement("div");d.className="card";
  d.innerHTML=`<div class="row">
    <label>Gene<select class="g">${names.map(k=>`<option>${k}</option>`).join("")}</select></label>
    <label>Mice to genotype<input class="n" type="number" min="1" value="${n||15}"></label>
    <button class="x" title="Remove">Remove</button></div><div class="out"></div>`;
  if(gene)d.querySelector(".g").value=gene;
  d.querySelector(".g").oninput=calc;d.querySelector(".n").oninput=calc;
  d.querySelector(".x").onclick=()=>{d.remove();};
  rowsEl.appendChild(d);calc();
}

function calc(){
  const extra=Math.max(0,parseInt(document.getElementById("extra").value)||0);
  rowsEl.querySelectorAll(".card").forEach(c=>{
    const g=G[c.querySelector(".g").value];
    const n=Math.max(0,parseInt(c.querySelector(".n").value)||0);
    const N=n+extra;
    const rx=[["Master mix (green)",g.mm],["IDTE buffer / water",g.idte],["Forward primer",g.f],["Reverse primer",g.r]];
    const mixPer=g.mm+g.idte+g.f+g.r;
    const gl=GEL[g.gel][size];
    const rec=GEL[g.gel][size];
    c.querySelector(".out").innerHTML=`
      <h2>Master mix for ${N} reactions <span class="note">(${n} mice + ${extra} extra)</span></h2>
      <div class="wrap"><table>
        <tr><th>Reagent</th><th class="n">Per rxn (\u00b5L)</th><th class="n">\u00d7 ${N} (\u00b5L)</th></tr>
        ${rx.map(r=>`<tr><td>${r[0]}</td><td class="n">${fmt(r[1])}</td><td class="n hl">${fmt(r[1]*N)}</td></tr>`).join("")}
        <tr class="tot"><td>Total master mix</td><td class="n">${fmt(mixPer)}</td><td class="n">${fmt(mixPer*N)}</td></tr>
      </table></div>
      <div><span class="pill">Aliquot ${fmt(mixPer)} \u00b5L mix per tube</span><span class="pill">+ ${fmt(g.dna)} \u00b5L DNA each</span><span class="pill">${fmt(g.total)} \u00b5L total per rxn</span></div>
      <h2>Gel</h2>
      <div><span class="pill">${g.gel}% agarose</span><span class="pill">Load ${fmt(g.load)} \u00b5L PCR product</span><span class="pill">Run ${g.time} min</span></div>
      <div class="note"><b>${size==="S"?"Small":"Large"} ${g.gel}% gel:</b> ${rec[0]} mL 1\u00d7 TAE + ${fmt(rec[1])} g agarose + ${fmt(rec[2])} \u00b5L EtBr/SybrGreen (about 3 min to prep, 20 min to set)</div>
      <div class="note">${g.bands}</div>`;
  });
}

document.getElementById("extra").oninput=calc;
document.getElementById("add").onclick=()=>addRow();
const gS=document.getElementById("gS"),gL=document.getElementById("gL");
gS.onclick=()=>{size="S";gS.classList.add("on");gL.classList.remove("on");calc();};
gL.onclick=()=>{size="L";gL.classList.add("on");gS.classList.remove("on");calc();};
addRow("Camkk2",15);
</script>
</body>
</html>
